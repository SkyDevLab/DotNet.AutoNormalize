<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#512BD4" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#312E81" stroke-width="6" />

  <!-- Subtle Inner Border Glow -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />

  <!-- Transformation Graphics: 3 Horizontal Canonicalization Bars -->
  <!-- Top Bar: Irregular dots on left -> Arrow/Funnel -> Clean aligned bar on right -->
  <g filter="url(#glow)">
    <!-- Bar 1 (Top) -->
    <circle cx="120" cy="170" r="14" fill="#A78BFA" opacity="0.5" />
    <circle cx="165" cy="170" r="14" fill="#A78BFA" opacity="0.8" />
    <path d="M 215 170 L 235 155 L 235 185 Z" fill="#818CF8" opacity="0.9" />
    <rect x="255" y="156" width="145" height="28" rx="14" fill="url(#barGrad1)" />

    <!-- Bar 2 (Middle - Key Accent) -->
    <circle cx="100" cy="256" r="14" fill="#818CF8" opacity="0.4" />
    <rect x="135" y="242" width="45" height="28" rx="14" fill="#818CF8" opacity="0.75" />
    <path d="M 205 256 L 225 241 L 225 271 Z" fill="#38BDF8" />
    <rect x="245" y="242" width="175" height="28" rx="14" fill="url(#barGrad2)" />

    <!-- Bar 3 (Bottom) -->
    <circle cx="130" cy="342" r="14" fill="#6366F1" opacity="0.6" />
    <circle cx="175" cy="342" r="14" fill="#6366F1" opacity="0.85" />
    <path d="M 220 342 L 240 327 L 240 357 Z" fill="#06B6D4" opacity="0.9" />
    <rect x="260" y="328" width="135" height="28" rx="14" fill="url(#barGrad3)" />
  </g>

  <!-- Canonical Alignment Guide Line (Dotted subtle vertical alignment reference) -->
  <line x1="250" y1="120" x2="250" y2="392" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6" opacity="0.3" />
</svg>
