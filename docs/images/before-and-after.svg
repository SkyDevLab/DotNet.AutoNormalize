<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="960" height="360" rx="16" fill="url(#compBg)" stroke="#1E293B" stroke-width="2" />

  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Before &amp; After Canonicalization</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">Automatic string representation canonicalization across incoming DTOs and database models.</text>

  <!-- Left: Raw Input (Red-ish accent) -->
  <rect x="40" y="100" width="410" height="225" rx="12" fill="url(#rawGrad)" stroke="#EF4444" stroke-width="1.5" />
  <rect x="40" y="100" width="410" height="36" rx="12" fill="#7F1D1D" opacity="0.6" />
  <text x="60" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5">RAW INCOMING PAYLOAD (UNTRUSTED)</text>

  <text x="60" y="160" font-family="Consolas, monospace" font-size="12" fill="#F8FAFC">{</text>
  <text x="80" y="185" font-family="Consolas, monospace" font-size="12" fill="#F87171">"name": "   Ada Lovelace   ",</text>
  <text x="80" y="210" font-family="Consolas, monospace" font-size="12" fill="#F87171">"email": "  ada@example.org  ",</text>
  <text x="80" y="235" font-family="Consolas, monospace" font-size="12" fill="#F87171">"bio": "      ",</text>
  <text x="80" y="260" font-family="Consolas, monospace" font-size="12" fill="#38BDF8">"code": "   indent_code   ",</text>
  <text x="80" y="285" font-family="Consolas, monospace" font-size="12" fill="#FCD34D">"password": "   MySecretP@ss!   "</text>
  <text x="60" y="310" font-family="Consolas, monospace" font-size="12" fill="#F8FAFC">}</text>

  <!-- Center Arrow -->
  <path d="M 465 210 L 495 210" stroke="#38BDF8" stroke-width="3" />
  <path d="M 485 200 L 495 210 L 485 220" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right: Normalized Result (Green accent) -->
  <rect x="510" y="100" width="410" height="225" rx="12" fill="url(#rawGrad)" stroke="#10B981" stroke-width="1.5" />
  <rect x="510" y="100" width="410" height="36" rx="12" fill="#064E3B" opacity="0.6" />
  <text x="530" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6EE7B7">NORMALIZED RESULT (IN-MEMORY / PERSISTED)</text>

  <text x="530" y="160" font-family="Consolas, monospace" font-size="12" fill="#F8FAFC">model.</text>
  <text x="530" y="185" font-family="Consolas, monospace" font-size="12" fill="#34D399">Name      = "Ada Lovelace"      // Trimmed</text>
  <text x="530" y="210" font-family="Consolas, monospace" font-size="12" fill="#34D399">Email     = "ada@example.org"   // Trimmed</text>
  <text x="530" y="235" font-family="Consolas, monospace" font-size="12" fill="#A78BFA">Bio       = null                // Empty-to-null</text>
  <text x="530" y="260" font-family="Consolas, monospace" font-size="12" fill="#38BDF8">Code      = "   indent_code   " // [PreserveWhitespace]</text>
  <text x="530" y="285" font-family="Consolas, monospace" font-size="12" fill="#FCD34D">Password  = "   MySecretP@ss!   " // Protected Name</text>
</svg>
