<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <defs>
    <linearGradient id="efBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="efCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="960" height="300" rx="16" fill="url(#efBg)" stroke="#1E293B" stroke-width="2" />

  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">Entity Framework Core — ChangeTracker Interception</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">Pre-persistence normalization triggered automatically during SaveChanges() and SaveChangesAsync().</text>

  <!-- Step 1: DbContext.SaveChanges() -->
  <rect x="40" y="105" width="180" height="150" rx="10" fill="url(#efCard)" stroke="#334155" stroke-width="1.5" />
  <text x="130" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">1. Trigger</text>
  <text x="130" y="165" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#38BDF8">db.SaveChanges()</text>
  <text x="130" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">or SaveChangesAsync()</text>
  <text x="130" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">CancellationToken safe</text>

  <path d="M 220 180 L 270 180" stroke="#64748B" stroke-width="2" />

  <!-- Step 2: ChangeTracker State Filtering -->
  <rect x="270" y="105" width="220" height="150" rx="10" fill="url(#efCard)" stroke="#6366F1" stroke-width="1.5" />
  <text x="380" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#C7D2FE">2. State Filtering</text>
  <text x="380" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34D399">✓ Added → Normalize</text>
  <text x="380" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34D399">✓ Modified → Normalize</text>
  <text x="380" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">✗ Unchanged → SKIPPED</text>
  <text x="380" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">✗ Deleted → SKIPPED</text>

  <path d="M 490 180 L 540 180" stroke="#64748B" stroke-width="2" />

  <!-- Step 3: Entity Normalization -->
  <rect x="540" y="105" width="210" height="150" rx="10" fill="url(#efCard)" stroke="#0284C7" stroke-width="1.5" />
  <text x="645" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">3. Entity Normalizer</text>
  <text x="645" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Traverse String Props</text>
  <text x="645" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#A5B4FC">Respects [PreserveWhitespace]</text>
  <text x="645" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#A5B4FC">Protects Sensitive Fields</text>
  <text x="645" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34D399">Supports Owned Entities</text>

  <path d="M 750 180 L 800 180" stroke="#64748B" stroke-width="2" />

  <!-- Step 4: Database Storage -->
  <rect x="800" y="105" width="120" height="150" rx="10" fill="url(#efCard)" stroke="#10B981" stroke-width="2" />
  <text x="860" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34D399">4. Database</text>
  <text x="860" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F8FAFC">Clean SQL</text>
  <text x="860" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F8FAFC">INSERT &amp;</text>
  <text x="860" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F8FAFC">UPDATE</text>
</svg>
