<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <defs>
    <linearGradient id="jsonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="960" height="300" rx="16" fill="url(#jsonBg)" stroke="#1E293B" stroke-width="2" />

  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">System.Text.Json — Constructor-Time Normalization</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8">In-flight token transformation enables zero-reflection normalization of C# positional records.</text>

  <!-- Step 1: Raw JSON -->
  <rect x="40" y="105" width="200" height="150" rx="10" fill="url(#stepGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="140" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">1. Raw JSON Stream</text>
  <text x="60" y="165" font-family="Consolas, monospace" font-size="11" fill="#F8FAFC">{"FullName":</text>
  <text x="75" y="185" font-family="Consolas, monospace" font-size="11" fill="#F43F5E"> "  Ada Lovelace  ",</text>
  <text x="60" y="205" font-family="Consolas, monospace" font-size="11" fill="#F8FAFC"> "Email": " ada@... "}</text>

  <path d="M 240 180 L 280 180" stroke="#64748B" stroke-width="2" />

  <!-- Step 2: Contract Modifier & Converter -->
  <rect x="280" y="105" width="220" height="150" rx="10" fill="url(#stepGrad)" stroke="#6366F1" stroke-width="1.5" />
  <text x="390" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#C7D2FE">2. AutoNormalize Modifier</text>
  <text x="390" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Hooks Property Contract</text>
  <text x="390" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#38BDF8">CustomConverter attached</text>
  <text x="390" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#10B981">Normalizes parameter token</text>

  <path d="M 500 180 L 540 180" stroke="#64748B" stroke-width="2" />

  <!-- Step 3: Constructor Instantiation -->
  <rect x="540" y="105" width="200" height="150" rx="10" fill="url(#stepGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="640" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">3. Record Constructor</text>
  <text x="640" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Invokes .ctor(arg1, arg2)</text>
  <text x="640" y="195" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#34D399">arg1 = "Ada Lovelace"</text>
  <text x="640" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Pre-instantiation clean</text>

  <path d="M 740 180 L 780 180" stroke="#64748B" stroke-width="2" />

  <!-- Step 4: Final Immutable Record -->
  <rect x="780" y="105" width="140" height="150" rx="10" fill="url(#stepGrad)" stroke="#10B981" stroke-width="2" />
  <text x="850" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34D399">4. Final Record</text>
  <text x="850" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F8FAFC">Immutable &amp;</text>
  <text x="850" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F8FAFC">Normalized</text>
  <text x="850" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38BDF8">Zero Unsafe IL</text>
</svg>
